<!DOCTYPE html>
<html lang="en" data-theme="light">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ILoveFiles</title>
        <meta name="description" content="Convert and Compress files locally" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
        <link rel="stylesheet" href="css/style.css" />
        <script>
          document.documentElement.dataset.theme =
            localStorage.getItem('theme') || 'light';
        </script>
    </head>

    <body>
        <button id="theme-toggle" aria-label="Toggle theme">☀</button>

        <main class="container">
            <section id="view-home" class="view">
                <hgroup>
                    <h1>I Love Files</h1>
                    <p>Convert and compress files locally. Nothing leaves your device</p>
                </hgroup>

                <button id="start-btn" role="button">Start Converting</button>

                <footer class="home-footer">
                    <p>
                        Built by <a href="https://github.com/damnitzhemanth-oss" target="_blank" rel="noopener">Hemanth</a>
                        · <a href="https://github.com/damnitzhemanth-oss/ILoveFiles" target="_blank" rel="noopener">GitHub</a>
                    </p>
                </footer>
            </section>

            <section id="view-app" class="view" hidden>
                <header class="app-header">
                    <button id="back-btn" class="secondary outline" aria-label="Back to Home">← Back</button>
                    <strong>I Love Files</strong>
                </header>

                <div id="dropzone" class="dropzone">
                    <p>Drop images here or click to choose</p>
                    <p class="dropzone-hint">JPG · PNG · WebP · GIF</p>
                    <input type="file" id="file-input" accept="image/*" multiple hidden />
                </div>

                <div id="presets" class="presets"></div>


                <section class="settings">
                    <div class="settings-row">
                        <label for="setting-format">Format</label>
                        <select id="setting-format">
                            <option value="image/webp">WebP</option>
                            <option value="image/jpeg">JPG</option>
                            <option value="image/png">PNG</option>
                        </select>
                    </div>

                    <div class="settings-row" id="quality-row">
                        <label for="setting-quality">
                            Quality <span id="quality-value">80</span>
                        </label>
                        <input type="range" id="setting-quality" min="10" max="100" step="5" />
                    </div>

                    <div class="settings-row">
                        <label for="setting-width">Max width (px · 0 = keep original)</label>
                        <input type="number" id="setting-width" min="0" step="100" />
                    </div>

                    <div class="settings-row">
                        <label for="setting-target-kb">Max file size (KB · blank = use quality)</label>
                        <input type="number" id="setting-target-kb" min="0" step="10" placeholder="e.g. 500" />
                    </div>
                </section>

                <div class="actions-row">
                     <button id="download-zip-btn" class="file-btn" type="button">Download all as ZIP</button>
                    <button id="convert-all-btn" class="file-btn file-btn-primary" type="button">
                        Convert all
                    </button>
                </div>

                <ul id="file-list" class="file-list"></ul>
                <p id="empty-hint" class="muted">No files yet.</p>
            </section>
        </main>

        <script type="module" src="js/main.js"></script>
    </body>
</html>
